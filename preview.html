<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3dFunlearn — Belajar tidak berhenti di halaman buku</title>
  <meta name="description" content="Media belajar 3D untuk kelas Indonesia didukung TutorFlow.">
  <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      margin: 0;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    .canvas-container { touch-action: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const HOTSPOTS_DATA = [
      { id: 1, name: 'Paru-paru Kanan (Pulmo Dexter)', shortName: 'Paru Kanan', pos: [-1.3, 0.2, 0.3], desc: 'Terdiri dari 3 lobus (superior, medius, inferior) yang menampung volume udara lebih besar.' },
      { id: 2, name: 'Paru-paru Kiri (Pulmo Sinister)', shortName: 'Paru Kiri', pos: [1.3, 0.1, 0.3], desc: 'Terdiri dari 2 lobus dan memiliki takik jantung (cardiac notch) untuk ruang jantung.' },
      { id: 3, name: 'Saluran Napas (Trakea & Bronkus)', shortName: 'Saluran Napas', pos: [0, 1.8, 0.2], desc: 'Pipa bertulang rawan yang menghantarkan udara bersih ke cabang bronkiolus.' },
      { id: 4, name: 'Diafragma', shortName: 'Diafragma', pos: [0, -2.1, 0.3], desc: 'Otot utama pernapasan yang memisahkan rongga dada dan rongga perut.' }
    ];

    const ALL_MODULES = [
      { id: 'sistem-pernapasan', num: 'MODUL 01', title: 'Sistem Pernapasan', status: 'Tersedia', free: true, desc: 'Mekanisme pertukaran gas, anatomi pulmo, bronkus, dan alveolus.' },
      { id: 'sistem-peredaran-darah', num: 'MODUL 02', title: 'Sistem Peredaran Darah', status: 'Segera Hadir', free: false, desc: 'Struktur jantung 4 ruang, katup bikuspid/trikuspid, dan sirkulasi darah.' },
      { id: 'sistem-pencernaan', num: 'MODUL 03', title: 'Sistem Pencernaan', status: 'Segera Hadir', free: false, desc: 'Saluran pencernaan mekanik dan kimiawi lambung hingga usus.' },
      { id: 'sistem-ekskresi', num: 'MODUL 04', title: 'Sistem Ekskresi', status: 'Segera Hadir', free: false, desc: 'Struktur ginjal, nefron, filtrasi darah, dan pembentukan urine.' },
      { id: 'sistem-gerak', num: 'MODUL 05', title: 'Sistem Gerak Manusia', status: 'Segera Hadir', free: false, desc: 'Rangka aksial, apendikular, sendi sinovial, dan kontraksi otot.' },
      { id: 'struktur-sel', num: 'MODUL 06', title: 'Sel Tumbuhan & Hewan', status: 'Segera Hadir', free: false, desc: 'Organel sel: nukleus, mitokondria, kloroplas, dan dinding sel.' }
    ];

    let audioCtx = null;
    let isAudioOn = false;
    function toggleGlobalAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      isAudioOn = !isAudioOn;
      return isAudioOn;
    }

    function LungCanvas({ selectedId, onSelect, isBreathing }) {
      const mountRef = useRef(null);
      const [rotating, setRotating] = useState(true);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070b14);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.z = 6.2;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const light1 = new THREE.DirectionalLight(0x38bdf8, 1.4);
        light1.position.set(5, 8, 6);
        scene.add(light1);
        const light2 = new THREE.DirectionalLight(0xf43f5e, 1.1);
        light2.position.set(-6, -2, 4);
        scene.add(light2);

        const grid = new THREE.GridHelper(14, 28, 0x1e293b, 0x0f172a);
        grid.position.y = -2.8;
        scene.add(grid);

        const rootGroup = new THREE.Group();
        scene.add(rootGroup);

        const lungMatRight = new THREE.MeshStandardMaterial({ color: 0xdf6a7a, roughness: 0.35, metalness: 0.1 });
        const lungMatLeft = new THREE.MeshStandardMaterial({ color: 0xd95f70, roughness: 0.35, metalness: 0.1 });
        const tracheaMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.25 });
        const cartilageMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
        const bronchMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3, emissive: 0x0284c7, emissiveIntensity: 0.2 });

        const rightGroup = new THREE.Group();
        const rSup = new THREE.Mesh(new THREE.SphereGeometry(0.85, 24, 18), lungMatRight);
        rSup.scale.set(1.0, 1.1, 0.85); rSup.position.set(-1.1, 0.7, 0); rSup.rotation.set(0.1, 0.15, 0.2);
        const rMid = new THREE.Mesh(new THREE.SphereGeometry(0.75, 24, 18), lungMatRight);
        rMid.scale.set(1.05, 0.8, 0.85); rMid.position.set(-1.25, -0.1, 0.1);
        const rInf = new THREE.Mesh(new THREE.SphereGeometry(0.95, 24, 18), lungMatRight);
        rInf.scale.set(1.15, 1.1, 0.9); rInf.position.set(-1.2, -1.0, -0.05);
        rightGroup.add(rSup, rMid, rInf);
        rootGroup.add(rightGroup);

        const leftGroup = new THREE.Group();
        const lSup = new THREE.Mesh(new THREE.SphereGeometry(0.85, 24, 18), lungMatLeft);
        lSup.scale.set(0.95, 1.15, 0.85); lSup.position.set(1.1, 0.65, 0); lSup.rotation.set(0.1, -0.15, -0.2);
        const lInf = new THREE.Mesh(new THREE.SphereGeometry(0.9, 24, 18), lungMatLeft);
        lInf.scale.set(1.05, 1.1, 0.88); lInf.position.set(1.15, -0.9, -0.05);
        leftGroup.add(lSup, lInf);
        rootGroup.add(leftGroup);

        const tracheaGroup = new THREE.Group();
        const trMain = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.22, 1.6, 20), tracheaMat);
        trMain.position.set(0, 1.8, 0.1);
        tracheaGroup.add(trMain);
        for (let i = 0; i < 7; i++) {
          const ring = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.035, 8, 20), cartilageMat);
          ring.position.set(0, 1.2 + i * 0.18, 0.1);
          ring.rotation.x = Math.PI / 2;
          tracheaGroup.add(ring);
        }
        const rBr = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.12, 0.9, 12), bronchMat);
        rBr.position.set(-0.45, 0.8, 0.05); rBr.rotation.z = Math.PI / 4;
        const lBr = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.11, 1.05, 12), bronchMat);
        lBr.position.set(0.5, 0.75, 0.05); lBr.rotation.z = -Math.PI / 3.4;
        tracheaGroup.add(rBr, lBr);
        rootGroup.add(tracheaGroup);

        const dia = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.8, 0.45, 24), new THREE.MeshStandardMaterial({ color: 0x9f1239, opacity: 0.75, transparent: true }));
        dia.position.set(0, -2.1, 0); dia.scale.set(1.0, 0.5, 0.75);
        rootGroup.add(dia);

        const sprites = [];
        HOTSPOTS_DATA.forEach(hs => {
          const c = document.createElement('canvas'); c.width = 64; c.height = 64;
          const ctx = c.getContext('2d');
          ctx.beginPath(); ctx.arc(32, 32, 24, 0, Math.PI * 2); ctx.fillStyle = '#10b981'; ctx.fill();
          ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
          ctx.font = 'bold 28px sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(hs.id, 32, 32);
          const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
          sp.position.set(...hs.pos); sp.scale.set(0.5, 0.5, 1);
          rootGroup.add(sp);
          sprites.push({ id: hs.id, sp });
        });

        let isDown = false, prev = { x: 0, y: 0 };
        const onDown = e => { isDown = true; prev = { x: e.clientX, y: e.clientY }; };
        const onMove = e => {
          if (!isDown) return;
          rootGroup.rotation.y += (e.clientX - prev.x) * 0.01;
          rootGroup.rotation.x += (e.clientY - prev.y) * 0.01;
          prev = { x: e.clientX, y: e.clientY };
        };
        const onUp = () => { isDown = false; };
        container.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);

        let reqId;
        const clock = new THREE.Clock();
        const animate = () => {
          reqId = requestAnimationFrame(animate);
          const t = clock.getElapsedTime();
          if (rotating && !isDown) rootGroup.rotation.y += 0.005;

          if (isBreathing) {
            const scale = 1 + Math.sin(t * 1.8) * 0.07;
            rightGroup.scale.set(scale, scale, scale);
            leftGroup.scale.set(scale, scale, scale);
            dia.position.y = -2.1 - Math.sin(t * 1.8) * 0.15;
          }
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(reqId);
          container.removeEventListener('mousedown', onDown);
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          renderer.dispose();
        };
      }, [rotating, isBreathing]);

      return (
        <div className="relative w-full h-full min-h-[460px]">
          <div className="absolute top-4 left-4 right-4 z-20 flex justify-between pointer-events-none">
            <span className="bg-slate-900/80 px-3 py-1.5 rounded-full text-xs font-semibold text-emerald-400 border border-slate-700 pointer-events-auto">
              Pulmones — paru-paru manusia
            </span>
            <button onClick={() => setRotating(!rotating)} className="bg-slate-800 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-200 border border-slate-700 pointer-events-auto hover:bg-slate-700">
              Putar: {rotating ? 'Aktif' : 'Diam'}
            </button>
          </div>
          <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />
          <div className="absolute bottom-3 left-0 right-0 text-center pointer-events-none text-xs text-slate-400">
            Seret untuk memutar · Gulir untuk zoom
          </div>
        </div>
      );
    }

    function App() {
      const [route, setRoute] = useState('/');
      const [catalogOpen, setCatalogOpen] = useState(false);
      const [audioOn, setAudioOn] = useState(false);
      const [breathing, setBreathing] = useState(true);
      const [selectedHotspot, setSelectedHotspot] = useState(1);
      const [diving, setDiving] = useState(false);
      const [shareOpen, setShareOpen] = useState(false);

      const navTo = (r) => { setRoute(r); window.scrollTo({ top: 0, behavior: 'smooth' }); };

      return (
        <div className="min-h-screen bg-[#0b0f19] text-slate-100 flex flex-col">
          {route !== '/masuk' && (
            <header className="border-b border-slate-800 bg-[#0b0f19]/90 sticky top-0 z-40 px-4 py-3 backdrop-blur-md">
              <div className="max-w-7xl mx-auto flex items-center justify-between">
                <div onClick={() => navTo('/')} className="flex items-center gap-2 cursor-pointer font-extrabold text-xl">
                  <div className="w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400">❖</div>
                  <span>3d<span className="text-emerald-400">Funlearn</span></span>
                </div>
                <div className="flex items-center gap-4 text-xs font-semibold">
                  <button onClick={() => navTo('/')} className="hover:text-emerald-400">Cara kerja</button>
                  <button onClick={() => setCatalogOpen(true)} className="hover:text-emerald-400">Modul</button>
                  <button onClick={() => navTo('/masuk')} className="hover:text-emerald-400">Masuk</button>
                  <span className="px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">ID</span>
                  <button onClick={() => navTo('/modul/sistem-pernapasan')} className="px-3.5 py-1.5 rounded-xl bg-emerald-500 text-slate-950 hover:bg-emerald-400 transition-colors">
                    Coba gratis
                  </button>
                </div>
              </div>
            </header>
          )}

          <main className="flex-1">
            {route === '/' && (
              <div>
                <section className="max-w-7xl mx-auto px-4 py-16 sm:py-24 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                  <div className="space-y-6">
                    <span className="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                      MEDIA BELAJAR 3D UNTUK KELAS INDONESIA
                    </span>
                    <h1 className="text-4xl sm:text-6xl font-black text-white leading-tight">
                      Belajar tidak berhenti di halaman buku.
                    </h1>
                    <p className="text-slate-300 text-base sm:text-lg">
                      Materi pelajaran dalam 3D yang bisa diputar, dibuka, dan diselami. Tayangkan di layar kelas — murid ikut dari HP lewat QR, tanpa akun dan tanpa instal.
                    </p>
                    <div className="flex gap-4">
                      <button onClick={() => navTo('/modul/sistem-pernapasan')} className="px-6 py-3 rounded-xl bg-emerald-500 text-slate-950 font-bold hover:bg-emerald-400 shadow-lg">
                        Coba modul gratis →
                      </button>
                      <button onClick={() => setCatalogOpen(true)} className="px-6 py-3 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700">
                        Lihat katalog
                      </button>
                    </div>
                  </div>
                  <div className="h-[480px] bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl relative">
                    <LungCanvas selectedId={selectedHotspot} onSelect={setSelectedHotspot} isBreathing={true} />
                  </div>
                </section>

                <section className="bg-[#080d1a] py-20 border-y border-slate-800">
                  <div className="max-w-7xl mx-auto px-4 text-center">
                    <h3 className="text-3xl font-extrabold text-white mb-12">Bawa sains hidup di depan mata murid.</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-4 gap-6 text-left">
                      <div className="p-6 bg-slate-900 rounded-2xl border border-slate-800">
                        <div className="text-emerald-400 text-xl font-bold mb-2">Putar.</div>
                        <p className="text-xs text-slate-300">Lihat bentuknya dari segala arah secara 360 derajat.</p>
                      </div>
                      <div className="p-6 bg-slate-900 rounded-2xl border border-slate-800">
                        <div className="text-cyan-400 text-xl font-bold mb-2">Buka.</div>
                        <p className="text-xs text-slate-300">Buka bagian dalamnya satu per satu, pelajari lobus dan trakea.</p>
                      </div>
                      <div className="p-6 bg-slate-900 rounded-2xl border border-slate-800">
                        <div className="text-indigo-400 text-xl font-bold mb-2">Selami.</div>
                        <p className="text-xs text-slate-300">Masuk ke bagian tak terlihat: mikroskopis alveolus dan kapiler.</p>
                      </div>
                      <div className="p-6 bg-slate-900 rounded-2xl border border-slate-800">
                        <div className="text-rose-400 text-xl font-bold mb-2">Murid ikut lewat QR.</div>
                        <p className="text-xs text-slate-300">Tanpa akun, tanpa instal — scan langsung dari layar kelas.</p>
                      </div>
                    </div>
                  </div>
                </section>

                <section className="max-w-7xl mx-auto px-4 py-20">
                  <h3 className="text-3xl font-extrabold text-white mb-2">Dimulai dari IPA.</h3>
                  <p className="text-slate-400 text-sm mb-8">6 modul IPA Kelas 8 siap dipakai hari ini. Semua dalam satu langganan.</p>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {ALL_MODULES.map(m => (
                      <div key={m.id} onClick={() => m.free && navTo('/modul/sistem-pernapasan')} className={`p-6 rounded-2xl border ${m.free ? 'bg-slate-900 border-slate-700 hover:border-emerald-500 cursor-pointer shadow-lg' : 'bg-slate-900/40 border-slate-800 opacity-60'}`}>
                        <div className="flex justify-between text-xs font-bold mb-2">
                          <span className="text-slate-400">{m.num}</span>
                          <span className={m.free ? 'text-emerald-400' : 'text-slate-500'}>{m.free ? 'GRATIS' : 'Segera Hadir'}</span>
                        </div>
                        <h4 className="text-lg font-bold text-white mb-2">{m.title}</h4>
                        <p className="text-xs text-slate-400">{m.desc}</p>
                      </div>
                    ))}
                  </div>
                </section>
              </div>
            )}

            {route === '/modul/sistem-pernapasan' && (
              <div className="flex flex-col lg:flex-row h-[calc(100vh-60px)]">
                <aside className="w-full lg:w-80 bg-[#0b0f19] border-r border-slate-800 p-6 space-y-6 overflow-y-auto">
                  <div>
                    <span className="text-xs font-bold text-emerald-400">MODUL 01 · IPA Kelas 8</span>
                    <h2 className="text-2xl font-black text-white">Sistem Pernapasan</h2>
                    <p className="text-xs text-slate-400 mt-1">Pratinjau · materi sedang diverifikasi</p>
                  </div>

                  <div>
                    <div className="text-xs font-bold text-slate-400 uppercase mb-2">BAGIAN (12 TITIK BELAJAR)</div>
                    <div className="space-y-1.5">
                      {HOTSPOTS_DATA.map(h => (
                        <button key={h.id} onClick={() => { setSelectedHotspot(h.id); setDiving(false); }} className={`w-full text-left p-2.5 rounded-xl text-xs font-semibold border ${selectedHotspot === h.id && !diving ? 'bg-emerald-500/20 border-emerald-500 text-white' : 'bg-slate-900 border-slate-800 text-slate-300'}`}>
                          {h.id}. {h.name}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <div className="text-xs font-bold text-slate-400 uppercase mb-2">AKTIVITAS</div>
                    <div className="space-y-2">
                      <button onClick={() => setBreathing(!breathing)} className={`w-full p-3 rounded-xl text-xs font-bold border flex justify-between ${breathing ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>
                        <span>Animasi Napas</span>
                        <span>{breathing ? 'Aktif' : 'Mati'}</span>
                      </button>
                      <button onClick={() => setDiving(!diving)} className={`w-full p-3 rounded-xl text-xs font-bold border flex justify-between ${diving ? 'bg-indigo-500/30 border-indigo-500 text-indigo-300' : 'bg-slate-900 border-slate-800 text-slate-300'}`}>
                        <span>Menyelam ke alveolus</span>
                        <span>{diving ? 'Di dalam' : 'Buka'}</span>
                      </button>
                    </div>
                  </div>
                </aside>

                <div className="flex-1 relative bg-[#070b14]">
                  {diving ? (
                    <div className="w-full h-full flex flex-col items-center justify-center p-8 text-center space-y-4">
                      <div className="w-24 h-24 rounded-full bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-300 text-3xl animate-pulse">🍇</div>
                      <h3 className="text-2xl font-bold text-white">Mikroskopis Alveoli & Kapiler Darah</h3>
                      <p className="text-xs text-slate-300 max-w-md">Pertukaran gas O₂ dan CO₂ berlangsung secara difusi melalui dinding tipis selapis epitel.</p>
                      <button onClick={() => setDiving(false)} className="px-4 py-2 rounded-xl bg-emerald-500 text-slate-950 font-bold text-xs">
                        ← Kembali ke Paru-paru
                      </button>
                    </div>
                  ) : (
                    <LungCanvas selectedId={selectedHotspot} onSelect={setSelectedHotspot} isBreathing={breathing} />
                  )}

                  <div className="absolute top-4 right-4 flex gap-2">
                    <button onClick={() => setShareOpen(true)} className="px-3 py-1.5 rounded-lg bg-slate-800 text-xs font-semibold text-emerald-400 border border-slate-700">
                      Bagikan ke murid (QR)
                    </button>
                    <a href="https://wa.me/6287713633066" target="_blank" className="px-3 py-1.5 rounded-lg bg-slate-800 text-xs font-semibold text-slate-300 border border-slate-700">
                      Kirim Masukan
                    </a>
                  </div>
                </div>

                <aside className="w-full lg:w-80 bg-[#0b0f19] border-l border-slate-800 p-6 space-y-6 overflow-y-auto">
                  <div className="p-4 bg-slate-900 rounded-2xl border border-slate-800 space-y-2">
                    <div className="text-[10px] font-bold text-emerald-400 uppercase">ORGAN · SISTEM PERNAPASAN</div>
                    <h3 className="text-xl font-bold text-white">Paru-paru</h3>
                    <p className="text-xs text-slate-300">Pabrik oksigen tubuhmu. Memasukkan O₂ dan membuang CO₂.</p>
                  </div>
                  <div>
                    <h4 className="text-xs font-bold text-slate-400 uppercase mb-2">FAKTA KUNCI</h4>
                    <div className="grid grid-cols-2 gap-2 text-xs">
                      <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                        <span className="text-slate-400 block text-[10px]">Lobus</span>
                        <strong className="text-white">3 + 2</strong>
                      </div>
                      <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                        <span className="text-slate-400 block text-[10px]">Napas / Hari</span>
                        <strong className="text-white">± 20.000</strong>
                      </div>
                    </div>
                  </div>
                  <div className="p-4 bg-amber-500/10 border border-amber-500/20 rounded-2xl text-xs text-amber-200">
                    <strong>Tahukah kamu?</strong> Kalau seluruh dinding alveolus dibentangkan, luasnya sekitar 70 m² — seluas ruang kelas!
                  </div>
                </aside>
              </div>
            )}

            {route === '/masuk' && (
              <div className="max-w-md mx-auto my-20 p-8 bg-slate-900 border border-slate-800 rounded-3xl space-y-6 text-center">
                <div onClick={() => navTo('/')} className="font-extrabold text-2xl cursor-pointer">
                  3d<span className="text-emerald-400">Funlearn</span>
                </div>
                <h2 className="text-2xl font-bold text-white">Masuk untuk membuka semua modul.</h2>
                <p className="text-xs text-slate-400">Satu akun Google untuk satu guru. Modul Sistem Pernapasan tetap bisa dicoba gratis.</p>
                <button onClick={() => navTo('/modul/sistem-pernapasan')} className="w-full py-3.5 bg-white text-slate-950 font-bold rounded-2xl text-sm flex items-center justify-center gap-2 shadow-xl hover:bg-slate-100">
                  <span>Masuk dengan Google</span>
                </button>
                <div className="text-left text-xs text-slate-400 space-y-2 pt-4 border-t border-slate-800">
                  <div>✓ Buka semua modul selama berlangganan.</div>
                  <div>✓ Bagikan ke murid lewat QR tanpa akun.</div>
                  <div>✓ Cukup akun Google, tanpa password.</div>
                </div>
                <button onClick={() => navTo('/')} className="text-xs text-slate-400 hover:text-emerald-400">
                  ← Kembali ke beranda
                </button>
              </div>
            )}
          </main>

          <footer className="border-t border-slate-800 py-6 px-4 bg-[#070b14] text-xs text-slate-400">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>Didukung <strong className="text-slate-200">TutorFlow</strong></div>
              <button onClick={() => setAudioOn(toggleGlobalAudio())} className="px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-slate-300">
                Suara: {audioOn ? 'Hidup' : 'Mati'}
              </button>
              <div className="flex gap-4">
                <button onClick={() => navTo('/privasi')} className="hover:text-white">Kebijakan Privasi</button>
                <span>·</span>
                <button onClick={() => navTo('/syarat')} className="hover:text-white">Syarat Layanan</button>
              </div>
            </div>
          </footer>

          {shareOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-sm w-full text-center space-y-4">
                <h3 className="text-lg font-bold text-white">Bagikan ke Murid</h3>
                <div className="p-6 bg-white rounded-xl inline-block">
                  <div className="w-36 h-36 bg-slate-900 flex items-center justify-center text-white text-xs font-mono">
                    [QR CODE LINK]
                  </div>
                </div>
                <p className="text-xs text-slate-400">Murid membuka kamera HP dan scan langsung dari layar kelas.</p>
                <button onClick={() => setShareOpen(false)} className="w-full py-2 bg-slate-800 rounded-xl text-xs font-semibold text-slate-200">
                  Tutup
                </button>
              </div>
            </div>
          )}

          {catalogOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-2xl w-full max-h-[80vh] overflow-y-auto space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 className="text-lg font-bold text-white">Katalog Modul IPA Kelas 8</h3>
                  <button onClick={() => setCatalogOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {ALL_MODULES.map(m => (
                    <div key={m.id} onClick={() => { if (m.free) { navTo('/modul/sistem-pernapasan'); setCatalogOpen(false); } }} className={`p-4 rounded-xl border ${m.free ? 'bg-slate-800 border-emerald-500/50 cursor-pointer' : 'bg-slate-900 border-slate-800 opacity-60'}`}>
                      <div className="text-[10px] font-bold text-emerald-400">{m.num}</div>
                      <div className="font-bold text-white text-sm">{m.title}</div>
                      <div className="text-xs text-slate-400 mt-1">{m.desc}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
