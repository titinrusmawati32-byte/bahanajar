<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3dFunlearn — Belajar tidak berhenti di halaman buku</title>
  <meta name="description" content="Media belajar 3D untuk kelas Indonesia didukung TutorFlow.">
  <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      margin: 0;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    .canvas-container { touch-action: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Curricula & Constant Data ---
    const DEFAULT_HOTSPOTS = [
      { id: 1, name: 'Paru-paru Kanan (Pulmo Dexter)', shortName: 'Paru Kanan', pos: [-1.3, 0.2, 0.3], desc: 'Terdiri dari 3 lobus (superior, medius, inferior) yang menampung volume udara lebih besar.', func: 'Menyerap oksigen dari udara dan mengedarkannya ke pembuluh kapiler.' },
      { id: 2, name: 'Paru-paru Kiri (Pulmo Sinister)', shortName: 'Paru Kiri', pos: [1.3, 0.1, 0.3], desc: 'Terdiri dari 2 lobus dan memiliki takik jantung (cardiac notch) untuk ruang jantung.', func: 'Memfasilitasi difusi gas antara alveolus dan aliran darah sistemik.' },
      { id: 3, name: 'Saluran Napas (Trakea & Bronkus)', shortName: 'Saluran Napas', pos: [0, 1.8, 0.2], desc: 'Pipa bertulang rawan yang menghantarkan udara bersih ke cabang bronkiolus.', func: 'Menyalurkan udara hangat, lembap, dan bersih langsung ke paru-paru.' },
      { id: 4, name: 'Diafragma', shortName: 'Diafragma', pos: [0, -2.1, 0.3], desc: 'Otot utama pernapasan yang memisahkan rongga dada dan rongga perut.', func: 'Berkontraksi ke bawah saat inspirasi untuk memperbesar volume rongga dada.' }
    ];

    const DEFAULT_MODULES = [
      { id: 'sistem-pernapasan', num: 'MODUL 01', title: 'Sistem Pernapasan', status: 'Tersedia', free: true, desc: 'Mekanisme pertukaran gas, anatomi pulmo, bronkus, dan alveolus.', specimen: 'Pulmones' },
      { id: 'sistem-peredaran-darah', num: 'MODUL 02', title: 'Sistem Peredaran Darah', status: 'Segera Hadir', free: false, desc: 'Struktur jantung 4 ruang, katup bikuspid/trikuspid, dan sirkulasi darah.', specimen: 'Cor Humanum' },
      { id: 'sistem-pencernaan', num: 'MODUL 03', title: 'Sistem Pencernaan', status: 'Segera Hadir', free: false, desc: 'Saluran pencernaan mekanik dan kimiawi lambung hingga usus.', specimen: 'Tractus Digestivus' },
      { id: 'sistem-ekskresi', num: 'MODUL 04', title: 'Sistem Ekskresi', status: 'Segera Hadir', free: false, desc: 'Struktur ginjal, nefron, filtrasi darah, dan pembentukan urine.', specimen: 'Ren & Nefron' },
      { id: 'sistem-gerak', num: 'MODUL 05', title: 'Sistem Gerak Manusia', status: 'Segera Hadir', free: false, desc: 'Rangka aksial, apendikular, sendi sinovial, dan kontraksi otot.', specimen: 'Skeleton Humanum' },
      { id: 'struktur-sel', num: 'MODUL 06', title: 'Sel Tumbuhan & Hewan', status: 'Segera Hadir', free: false, desc: 'Organel sel: nukleus, mitokondria, kloroplas, dan dinding sel.', specimen: 'Cellula' }
    ];

    const DEFAULT_FACTS = [
      { label: 'Lokasi', value: 'Rongga dada, dilindungi tulang rusuk' },
      { label: 'Jumlah lobus', value: 'Kanan 3, kiri 2' },
      { label: 'Napas per hari', value: '± 20.000 kali' },
      { label: 'Oksigen udara', value: '± 21% dihirup, ± 16% dihembuskan' }
    ];

    const DEFAULT_AIRWAY = [
      { step: 1, name: 'Hidung', inModule: false },
      { step: 2, name: 'Faring', inModule: false },
      { step: 3, name: 'Laring', inModule: false },
      { step: 4, name: 'Trakea', inModule: true },
      { step: 5, name: 'Bronkus', inModule: true },
      { step: 6, name: 'Bronkiolus', inModule: true },
      { step: 7, name: 'Alveolus', inModule: true }
    ];

    // LocalStorage helper functions
    const loadStored = (key, fallback) => {
      try {
        const val = localStorage.getItem('3dfunlearn_' + key);
        return val ? JSON.parse(val) : fallback;
      } catch (e) {
        return fallback;
      }
    };

    const saveStored = (key, data) => {
      try {
        localStorage.setItem('3dfunlearn_' + key, JSON.stringify(data));
      } catch (e) {}
    };

    // --- Audio Service Synthesis ---
    let audioCtx = null;
    let breathOsc = null;
    let breathGain = null;

    function playClickSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      } catch (e) {}
    }

    function toggleGlobalAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        breathGain = audioCtx.createGain();
        breathGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        breathGain.connect(audioCtx.destination);

        breathOsc = audioCtx.createOscillator();
        breathOsc.type = 'triangle';
        breathOsc.frequency.setValueAtTime(65, audioCtx.currentTime);
        breathOsc.connect(breathGain);
        breathOsc.start();
        return true;
      } else {
        if (audioCtx.state === 'running') {
          audioCtx.suspend();
          return false;
        } else {
          audioCtx.resume();
          return true;
        }
      }
    }

    // --- Three.js Lung Canvas Component ---
    function LungCanvas({ selectedId, onSelect, isBreathing, hotspots }) {
      const mountRef = useRef(null);
      const sceneRef = useRef(null);
      const rendererRef = useRef(null);
      const cameraRef = useRef(null);
      const lungsGroupRef = useRef(null);
      const diaphragmRef = useRef(null);
      const pinsRef = useRef([]);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth || 600;
        const height = container.clientHeight || 500;

        const scene = new THREE.Scene();
        sceneRef.current = scene;

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(0, 0, 6.2);
        cameraRef.current = camera;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        rendererRef.current = renderer;
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        // Lighting
        const ambLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambLight);
        const dirLight = new THREE.DirectionalLight(0x6ee7b7, 1.4);
        dirLight.position.set(5, 8, 6);
        scene.add(dirLight);
        const rimLight = new THREE.DirectionalLight(0x06b6d4, 1.0);
        rimLight.position.set(-5, -3, -4);
        scene.add(rimLight);

        // Lungs Model Group
        const rootGroup = new THREE.Group();
        lungsGroupRef.current = rootGroup;
        scene.add(rootGroup);

        // Material
        const lungMat = new THREE.MeshStandardMaterial({
          color: 0xef4444,
          roughness: 0.35,
          metalness: 0.1,
          bumpScale: 0.05
        });

        // Right Lung (3 Lobes)
        const rightGroup = new THREE.Group();
        const rSup = new THREE.Mesh(new THREE.SphereGeometry(0.72, 24, 24), lungMat);
        rSup.position.set(-1.25, 0.65, 0);
        rSup.scale.set(1.0, 1.35, 0.85);
        rightGroup.add(rSup);

        const rMed = new THREE.Mesh(new THREE.SphereGeometry(0.68, 24, 24), lungMat);
        rMed.position.set(-1.3, -0.05, 0.1);
        rMed.scale.set(1.05, 1.1, 0.9);
        rightGroup.add(rMed);

        const rInf = new THREE.Mesh(new THREE.SphereGeometry(0.75, 24, 24), lungMat);
        rInf.position.set(-1.25, -0.85, 0);
        rInf.scale.set(1.15, 1.25, 0.95);
        rightGroup.add(rInf);
        rootGroup.add(rightGroup);

        // Left Lung (2 Lobes + Cardiac Notch)
        const leftGroup = new THREE.Group();
        const lSup = new THREE.Mesh(new THREE.SphereGeometry(0.7, 24, 24), lungMat);
        lSup.position.set(1.25, 0.55, 0);
        lSup.scale.set(0.95, 1.4, 0.85);
        leftGroup.add(lSup);

        const lInf = new THREE.Mesh(new THREE.SphereGeometry(0.78, 24, 24), lungMat);
        lInf.position.set(1.3, -0.75, 0);
        lInf.scale.set(1.1, 1.3, 0.9);
        leftGroup.add(lInf);
        rootGroup.add(leftGroup);

        // Trachea & Bronchi
        const tracheaMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.4 });
        const trachea = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 1.6, 20), tracheaMat);
        trachea.position.set(0, 1.5, 0);
        rootGroup.add(trachea);

        // Diaphragm
        const diaMat = new THREE.MeshStandardMaterial({ color: 0x9f1239, transparent: true, opacity: 0.8 });
        const diaphragm = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.7, 0.4, 24), diaMat);
        diaphragm.position.set(0, -2.1, 0);
        diaphragm.scale.set(1, 0.4, 0.7);
        diaphragmRef.current = diaphragm;
        rootGroup.add(diaphragm);

        // Hotspot Pins
        const pins = [];
        const activeHotspots = hotspots || DEFAULT_HOTSPOTS;
        activeHotspots.forEach(hs => {
          const pinCanvas = document.createElement('canvas');
          pinCanvas.width = 64; pinCanvas.height = 64;
          const ctx = pinCanvas.getContext('2d');
          ctx.beginPath();
          ctx.arc(32, 32, 26, 0, Math.PI * 2);
          ctx.fillStyle = '#10b981';
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 26px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(hs.id, 32, 32);

          const tex = new THREE.CanvasTexture(pinCanvas);
          const spriteMat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
          const sprite = new THREE.Sprite(spriteMat);
          const p = hs.pos || hs.position || [0, 0, 0];
          sprite.position.set(p[0], p[1], p[2]);
          sprite.scale.set(0.48, 0.48, 1);
          rootGroup.add(sprite);
          pins.push({ id: hs.id, sprite, pos: p });
        });
        pinsRef.current = pins;

        // Interaction (Orbit rotation on drag)
        let isDown = false;
        let prevX = 0, prevY = 0;
        let rotY = 0, rotX = 0;

        const onDown = (e) => {
          isDown = true;
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          prevX = clientX; prevY = clientY;
        };

        const onMove = (e) => {
          if (!isDown) return;
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          const deltaX = clientX - prevX;
          const deltaY = clientY - prevY;
          prevX = clientX; prevY = clientY;
          rotY += deltaX * 0.008;
          rotX += deltaY * 0.008;
        };

        const onUp = () => { isDown = false; };

        container.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        container.addEventListener('touchstart', onDown);
        window.addEventListener('touchmove', onMove);
        window.addEventListener('touchend', onUp);

        // Click Raycasting on Pins
        const onClick = (e) => {
          const rect = container.getBoundingClientRect();
          const mouse = new THREE.Vector2(
            ((e.clientX - rect.left) / rect.width) * 2 - 1,
            -((e.clientY - rect.top) / rect.height) * 2 + 1
          );
          const raycaster = new THREE.Raycaster();
          raycaster.setFromCamera(mouse, camera);
          const sprites = pins.map(p => p.sprite);
          const hits = raycaster.intersectObjects(sprites);
          if (hits.length > 0) {
            playClickSound();
            const hitPin = pins.find(p => p.sprite === hits[0].object);
            if (hitPin) onSelect(hitPin.id);
          }
        };
        container.addEventListener('click', onClick);

        // Animation Loop
        let frameId;
        let time = 0;
        const animate = () => {
          time += 0.03;
          rootGroup.rotation.y = rotY;
          rootGroup.rotation.x = rotX;

          // Breathing
          if (isBreathing) {
            const breath = Math.sin(time * 2);
            rightGroup.scale.set(1 + breath * 0.05, 1 + breath * 0.04, 1 + breath * 0.06);
            leftGroup.scale.set(1 + breath * 0.05, 1 + breath * 0.04, 1 + breath * 0.06);
            if (diaphragmRef.current) {
              diaphragmRef.current.position.y = -2.1 - breath * 0.08;
            }
          }

          // Pins Pulse
          pins.forEach(p => {
            const isSel = p.id === selectedId;
            const pulse = isSel ? Math.sin(time * 6) * 0.08 : 0;
            p.sprite.scale.set(0.48 + pulse + (isSel ? 0.15 : 0), 0.48 + pulse + (isSel ? 0.15 : 0), 1);
          });

          renderer.render(scene, camera);
          frameId = requestAnimationFrame(animate);
        };
        animate();

        const handleResize = () => {
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          container.removeEventListener('mousedown', onDown);
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          container.removeEventListener('click', onClick);
        };
      }, [selectedId, isBreathing, hotspots]);

      return (
        <div ref={mountRef} className="w-full h-full relative canvas-container cursor-grab active:cursor-grabbing">
          <div className="absolute top-4 left-4 z-10 px-3 py-1.5 rounded-full bg-slate-900/80 border border-slate-700 text-[11px] text-slate-300 pointer-events-none flex items-center gap-1.5">
            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>Tahan & Geser untuk memutar 3D</span>
          </div>
        </div>
      );
    }

    // --- Main App Component ---
    function App() {
      const [route, setRoute] = useState('/');
      const [catalogOpen, setCatalogOpen] = useState(false);
      const [audioOn, setAudioOn] = useState(false);
      const [breathing, setBreathing] = useState(true);
      const [selectedHotspot, setSelectedHotspot] = useState(1);
      const [diving, setDiving] = useState(false);
      const [shareOpen, setShareOpen] = useState(false);
      const [adminTab, setAdminTab] = useState('hotspots');
      const [toastMsg, setToastMsg] = useState(null);

      // Data States with LocalStorage
      const [hotspots, setHotspots] = useState(() => loadStored('hotspots', DEFAULT_HOTSPOTS));
      const [modules, setModules] = useState(() => loadStored('modules', DEFAULT_MODULES));
      const [facts, setFacts] = useState(() => loadStored('facts', DEFAULT_FACTS));
      const [airway, setAirway] = useState(() => loadStored('airway', DEFAULT_AIRWAY));
      const [trivia, setTrivia] = useState(() => {
        try {
          return localStorage.getItem('3dfunlearn_trivia') || 'Kalau seluruh dinding alveolus dibentangkan, luasnya sekitar 70 m² — kira-kira seluas lantai ruang kelasmu!';
        } catch(e) {
          return 'Kalau seluruh dinding alveolus dibentangkan, luasnya sekitar 70 m² — kira-kira seluas lantai ruang kelasmu!';
        }
      });

      const navTo = (r) => { 
        playClickSound();
        setRoute(r); 
        window.scrollTo({ top: 0, behavior: 'smooth' }); 
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      const handleSaveAdminData = () => {
        playClickSound();
        saveStored('hotspots', hotspots);
        saveStored('modules', modules);
        saveStored('facts', facts);
        saveStored('airway', airway);
        try { localStorage.setItem('3dfunlearn_trivia', trivia); } catch(e) {}
        showToast('✓ Semua perubahan materi berhasil disimpan!');
      };

      const handleResetAdminData = () => {
        if (confirm('Kembalikan semua materi ke default kurikulum?')) {
          playClickSound();
          localStorage.removeItem('3dfunlearn_hotspots');
          localStorage.removeItem('3dfunlearn_modules');
          localStorage.removeItem('3dfunlearn_facts');
          localStorage.removeItem('3dfunlearn_airway');
          localStorage.removeItem('3dfunlearn_trivia');
          setHotspots(DEFAULT_HOTSPOTS);
          setModules(DEFAULT_MODULES);
          setFacts(DEFAULT_FACTS);
          setAirway(DEFAULT_AIRWAY);
          setTrivia('Kalau seluruh dinding alveolus dibentangkan, luasnya sekitar 70 m² — kira-kira seluas lantai ruang kelasmu!');
          showToast('Data materi berhasil direset ke default.');
        }
      };

      const activeHotspotObj = hotspots.find(h => h.id === selectedHotspot) || hotspots[0];

      return (
        <div className="min-h-screen bg-[#0b0f19] text-slate-100 flex flex-col">
          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-2xl border border-emerald-400 font-semibold animate-bounce">
              {toastMsg}
            </div>
          )}

          {/* Top Navbar */}
          {route !== '/masuk' && (
            <header className="border-b border-slate-800 bg-[#0b0f19]/90 sticky top-0 z-40 px-4 py-3 backdrop-blur-md">
              <div className="max-w-7xl mx-auto flex items-center justify-between">
                <div onClick={() => navTo('/')} className="flex items-center gap-2 cursor-pointer font-extrabold text-xl">
                  <div className="w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400">❖</div>
                  <span>3d<span className="text-emerald-400">Funlearn</span></span>
                </div>
                <div className="flex items-center gap-4 text-xs font-semibold">
                  <button onClick={() => navTo('/')} className="hover:text-emerald-400 hidden sm:block">Cara kerja</button>
                  <button onClick={() => setCatalogOpen(true)} className="hover:text-emerald-400">Modul</button>
                  <button onClick={() => navTo('/admin')} className="text-emerald-400 font-bold hover:underline flex items-center gap-1 bg-emerald-500/10 px-2.5 py-1 rounded-lg border border-emerald-500/30">
                    ⚙ Admin
                  </button>
                  <button onClick={() => navTo('/masuk')} className="hover:text-emerald-400">Masuk</button>
                  <span className="px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">ID</span>
                  <button onClick={() => navTo('/modul/sistem-pernapasan')} className="px-3.5 py-1.5 rounded-xl bg-emerald-500 text-slate-950 hover:bg-emerald-400 transition-colors">
                    Coba gratis
                  </button>
                </div>
              </div>
            </header>
          )}

          {/* Router Content */}
          <main className="flex-1">
            {/* 1. Landing Page */}
            {route === '/' && (
              <div>
                {/* Hero */}
                <section className="max-w-7xl mx-auto px-4 py-16 sm:py-24 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                  <div className="space-y-6">
                    <span className="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                      MEDIA BELAJAR 3D UNTUK KELAS INDONESIA
                    </span>
                    <h1 className="text-4xl sm:text-6xl font-black text-white leading-tight">
                      Belajar tidak berhenti di halaman buku.
                    </h1>
                    <p className="text-slate-300 text-base sm:text-lg">
                      Materi pelajaran dalam 3D yang bisa diputar, dibuka, dan diselami. Tayangkan di layar kelas — murid ikut dari HP lewat QR, tanpa akun dan tanpa instal.
                    </p>
                    <div className="flex gap-4">
                      <button onClick={() => navTo('/modul/sistem-pernapasan')} className="px-6 py-3 rounded-xl bg-emerald-500 text-slate-950 font-bold hover:bg-emerald-400 shadow-lg">
                        Coba modul gratis →
                      </button>
                      <button onClick={() => setCatalogOpen(true)} className="px-6 py-3 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700">
                        Lihat katalog
                      </button>
                    </div>
                  </div>
                  <div className="h-[480px] bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl relative">
                    <LungCanvas selectedId={selectedHotspot} onSelect={setSelectedHotspot} isBreathing={true} hotspots={hotspots} />
                  </div>
                </section>

                {/* Cara Kerja */}
                <section className="bg-[#080d1a] py-20 border-y border-slate-800">
                  <div className="max-w-7xl mx-auto px-4 text-center">
                    <h3 className="text-3xl font-extrabold text-white mb-12">Bawa sains hidup di depan mata murid.</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-4 gap-6 text-left">
                      <div className="p-6 bg-slate-900 rounded-2xl border border-slate-800">
                        <div className="text-emerald-400 text-xl font-bold mb-2">Putar.</div>
                        <p className="text-xs text-slate-300">Lihat bentuknya dari segala arah secara 360 derajat.</p>
                      </div>

                </div>
                <p className="text-xs text-slate-400">Murid membuka kamera HP dan scan langsung dari layar kelas.</p>
                <button onClick={() => setShareOpen(false)} className="w-full py-2 bg-slate-800 rounded-xl text-xs font-semibold text-slate-200">
                  Tutup
                </button>
              </div>
            </div>
          )}

          {/* Catalog Modal */}
          {catalogOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-2xl w-full max-h-[80vh] overflow-y-auto space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 className="text-lg font-bold text-white">Katalog Modul IPA Kelas 8</h3>
                  <button onClick={() => setCatalogOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {modules.map(m => (
                    <div key={m.id} onClick={() => { if (m.free) { navTo('/modul/sistem-pernapasan'); setCatalogOpen(false); } }} className={`p-4 rounded-xl border ${m.free ? 'bg-slate-800 border-emerald-500/50 cursor-pointer' : 'bg-slate-900 border-slate-800 opacity-60'}`}>
                      <div className="text-[10px] font-bold text-emerald-400">{m.num}</div>
                      <div className="font-bold text-white text-sm">{m.title}</div>
                      <div className="text-xs text-slate-400 mt-1">{m.desc}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
