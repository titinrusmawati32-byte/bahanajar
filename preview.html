    const DEFAULT_HOTSPOTS = [

      { id: 2, name: 'Paru-paru Kiri (Pulmo Sinister)', shortName: 'Paru Kiri', pos: [1.3, 0.1, 0.3], desc: 'Terdiri dari 2 lobus dan memiliki takik jantung (cardiac notch) untuk ruang jantung.', func: 'Memfasilitasi difusi gas antara alveolus dan aliran darah sistemik.' },

    const DEFAULT_MODULES = [
      { id: 'sistem-pernapasan', num: 'MODUL 01', title: 'Sistem Pernapasan', status: 'Tersedia', free: true, desc: 'Mekanisme pertukaran gas, anatomi pulmo, bronkus, dan alveolus.', specimen: 'Pulmones' },
      { id: 'sistem-peredaran-darah', num: 'MODUL 02', title: 'Sistem Peredaran Darah', status: 'Segera Hadir', free: false, desc: 'Struktur jantung 4 ruang, katup bikuspid/trikuspid, dan sirkulasi darah.', specimen: 'Cor Humanum' },

    const DEFAULT_FACTS = [
      { label: 'Lokasi', value: 'Rongga dada, dilindungi tulang rusuk' },

      { step: 3, name: 'Laring', inModule: false },

    // LocalStorage helper functions
    const loadStored = (key, fallback) => {
      try {
        const val = localStorage.getItem('3dfunlearn_' + key);
        return val ? JSON.parse(val) : fallback;
      } catch (e) {
        return fallback;
      }

    const saveStored = (key, data) => {

        localStorage.setItem('3dfunlearn_' + key, JSON.stringify(data));
      } catch (e) {}
    };

    // --- Audio Service Synthesis ---
    let audioCtx = null;
    let breathOsc = null;
    let breathGain = null;

    function playClickSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      } catch (e) {}
    }

    function toggleGlobalAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        breathGain = audioCtx.createGain();
        breathGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        breathGain.connect(audioCtx.destination);

        breathOsc = audioCtx.createOscillator();
        breathOsc.type = 'triangle';
        breathOsc.frequency.setValueAtTime(65, audioCtx.currentTime);
        breathOsc.connect(breathGain);
        breathOsc.start();
        return true;
      } else {
        if (audioCtx.state === 'running') {
          audioCtx.suspend();
          return false;
        } else {
          audioCtx.resume();
          return true;
        }
      }
    }

    // --- Procedural High-Res Medical Anatomy Textures Generator ---
    let cachedTextures = null;
    function getMedicalLungTextures() {
      if (cachedTextures) return cachedTextures;
      const size = 512;
      
      // 1. Visceral Pleura Albedo (Secondary pulmonary lobules & capillaries)
      const cDiff = document.createElement('canvas');
      cDiff.width = size; cDiff.height = size;
      const ctxD = cDiff.getContext('2d');
      const grad = ctxD.createLinearGradient(0, 0, 0, size);
      grad.addColorStop(0, '#c75d5e');
      grad.addColorStop(0.5, '#ba4849');
      grad.addColorStop(1, '#9e3436');
      ctxD.fillStyle = grad;
      ctxD.fillRect(0, 0, size, size);

      // Mottled visceral pleura texture
      const imgDataD = ctxD.getImageData(0, 0, size, size);
      const dataD = imgDataD.data;
      for (let i = 0; i < dataD.length; i += 4) {
        const noise = (Math.random() - 0.5) * 28;
        dataD[i] = Math.min(255, Math.max(0, dataD[i] + noise));
        dataD[i+1] = Math.min(255, Math.max(0, dataD[i+1] + noise * 0.7));
        dataD[i+2] = Math.min(255, Math.max(0, dataD[i+2] + noise * 0.6));
      }
      ctxD.putImageData(imgDataD, 0, 0);

      // Lobule polygons & subpleural capillaries
      ctxD.strokeStyle = 'rgba(70, 15, 20, 0.4)';
      ctxD.lineWidth = 1.2;
      for (let l = 0; l < 45; l++) {
        let lx = Math.random() * size, ly = Math.random() * size;
        ctxD.beginPath();
        ctxD.moveTo(lx, ly);
        const steps = 4 + Math.floor(Math.random() * 3);
        for (let s = 0; s < steps; s++) {
          lx += (Math.random() - 0.5) * 45;
          ly += (Math.random() - 0.5) * 45;
          ctxD.lineTo(lx, ly);
        }
        ctxD.stroke();
      }

      // Branching micro-capillaries
      ctxD.strokeStyle = 'rgba(95, 12, 18, 0.55)';
      for (let c = 0; c < 24; c++) {
        let cx = Math.random() * size, cy = Math.random() * size;
        ctxD.lineWidth = 1.6;
        ctxD.beginPath();
        ctxD.moveTo(cx, cy);
        for (let b = 0; b < 6; b++) {
          cx += (Math.random() - 0.5) * 35;
          cy += (Math.random() - 0.3) * 35;
          ctxD.lineTo(cx, cy);
        }
        ctxD.stroke();
      }

      const diffTex = new THREE.CanvasTexture(cDiff);
      diffTex.wrapS = THREE.RepeatWrapping;
      diffTex.wrapT = THREE.RepeatWrapping;

      // 2. Normal Map (Sobel filter from height)
      const cNorm = document.createElement('canvas');
      cNorm.width = size; cNorm.height = size;
      const ctxN = cNorm.getContext('2d');
      const imgDataN = ctxN.createImageData(size, size);
      const dataN = imgDataN.data;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const idx = (y * size + x) * 4;
          const left = dataD[(y * size + Math.max(0, x - 1)) * 4];
          const right = dataD[(y * size + Math.min(size - 1, x + 1)) * 4];
          const up = dataD[(Math.max(0, y - 1) * size + x) * 4];
          const down = dataD[(Math.min(size - 1, y + 1) * size + x) * 4];
          const dx = (left - right) * 0.035;
          const dy = (up - down) * 0.035;
          const dz = 1.0;
          const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
          dataN[idx] = Math.floor(((dx / len) * 0.5 + 0.5) * 255);
          dataN[idx+1] = Math.floor(((dy / len) * 0.5 + 0.5) * 255);
          dataN[idx+2] = Math.floor(((dz / len) * 0.5 + 0.5) * 255);
          dataN[idx+3] = 255;
        }
      }
      ctxN.putImageData(imgDataN, 0, 0);
      const normTex = new THREE.CanvasTexture(cNorm);
      normTex.wrapS = THREE.RepeatWrapping;
      normTex.wrapT = THREE.RepeatWrapping;

      // 3. Roughness Map (Visceral serosa sheen)
      const cRough = document.createElement('canvas');
      cRough.width = size; cRough.height = size;
      const ctxR = cRough.getContext('2d');
      ctxR.fillStyle = '#656565';
      ctxR.fillRect(0, 0, size, size);
      const roughTex = new THREE.CanvasTexture(cRough);

      // 4. Trachea Cartilage Rings Texture
      const cTrach = document.createElement('canvas');
      cTrach.width = 256; cTrach.height = 256;
      const ctxT = cTrach.getContext('2d');
      ctxT.fillStyle = '#cbd5e1';
      ctxT.fillRect(0, 0, 256, 256);
      for (let r = 0; r < 256; r += 20) {
        ctxT.fillStyle = '#94a3b8';
        ctxT.fillRect(0, r + 14, 256, 6);
      }
      const trachTex = new THREE.CanvasTexture(cTrach);
      trachTex.wrapS = THREE.RepeatWrapping;
      trachTex.wrapT = THREE.RepeatWrapping;

      cachedTextures = { diffuse: diffTex, normal: normTex, roughness: roughTex, trachea: trachTex };
      return cachedTextures;
    }

    // --- Anatomically Sculpted Lobe Geometry ---
    function sculptLobeGeometry(width, height, depth, lobeType) {
      const geo = new THREE.SphereGeometry(1, 40, 32);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let y = pos.getY(i);
        let z = pos.getZ(i);
        const ny = y;

        // Apex narrows, base expands
        const taper = 1.0 - (ny + 1.0) * 0.28;
        x *= Math.max(0.45, taper);
        z *= Math.max(0.5, taper);

        if (lobeType === 'rSuperior') {
          if (ny > 0.3) { x *= 0.8; z *= 0.85; }
          if (ny < -0.2) { y += (x + 0.3) * 0.25; }
          if (x > 0.3) x *= 0.7;
        } else if (lobeType === 'rMiddle') {
          z += 0.25;
          y *= 0.75;
          if (ny > 0.1) y -= (x + 0.2) * 0.15;
          if (ny < -0.1) y += (x + 0.2) * 0.2;
        } else if (lobeType === 'rInferior') {
          z -= 0.15;
          if (ny < -0.6) y += (1.0 - Math.sqrt(x * x + z * z)) * 0.35;
          if (ny > 0.1) y -= (x + 0.2) * 0.3;
        } else if (lobeType === 'lSuperior') {
          if (ny > 0.3) { x *= 0.8; z *= 0.85; }
          // CARDIAC NOTCH (Incisura Cardiaca)
          if (x < 0.2 && z > -0.2 && ny > -0.6 && ny < 0.3) {
            const notch = Math.sin((ny + 0.6) / 0.9 * Math.PI);
            x += notch * 0.42;
            z -= notch * 0.22;
          }
          // LINGULA
          if (x < -0.1 && z > 0.2 && ny >= -0.75 && ny <= -0.45) {
            z += 0.22;
            y -= 0.1;
          }
        } else if (lobeType === 'lInferior') {
          z -= 0.15;
          if (ny < -0.6) y += (1.0 - Math.sqrt(x * x + z * z)) * 0.35;
          if (ny > 0.1) y -= (-x + 0.2) * 0.3;
        }

        pos.setXYZ(i, x * width, y * height, z * depth);
      }
      geo.computeVertexNormals();
      return geo;
    }

    // --- Three.js Lung Canvas Component (Medical Anatomy 3D) ---
    function LungCanvas({ selectedId, onSelect, isBreathing, hotspots }) {
      const mountRef = useRef(null);
      const sceneRef = useRef(null);
      const rendererRef = useRef(null);
      const cameraRef = useRef(null);
      const lungsGroupRef = useRef(null);
      const diaphragmRef = useRef(null);
      const rightGroupRef = useRef(null);
      const leftGroupRef = useRef(null);
      const airParticlesRef = useRef(null);
      const pinsRef = useRef([]);
      const [studioMode, setStudioMode] = useState(true); // Medical Studio Light Mode (Image 2)

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth || 600;
        const height = container.clientHeight || 500;

        const scene = new THREE.Scene();
        sceneRef.current = scene;
        scene.background = new THREE.Color(studioMode ? 0xf8fafc : 0x070b14);

        const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 100);
        camera.position.set(0, 0.2, 5.8);
        cameraRef.current = camera;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = studioMode ? 1.15 : 1.25;
        rendererRef.current = renderer;
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        // Lighting Rig
        const ambLight = new THREE.AmbientLight(studioMode ? 0xffffff : 0xe2e8f0, studioMode ? 1.05 : 0.75);
        scene.add(ambLight);

        const keyLight = new THREE.DirectionalLight(0xfff5f0, studioMode ? 1.6 : 1.8);
        keyLight.position.set(5, 9, 7);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x93c5fd, studioMode ? 0.9 : 0.8);
        fillLight.position.set(-6, 2, 5);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffffff, studioMode ? 1.2 : 1.4);
        rimLight.position.set(0, 7, -6);
        scene.add(rimLight);

        // Contact Shadow Floor Plate
        const shadowMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(8, 8),
          new THREE.ShadowMaterial({ opacity: studioMode ? 0.18 : 0.35 })
        );
        shadowMesh.rotation.x = -Math.PI / 2;
        shadowMesh.position.y = -2.6;
        shadowMesh.receiveShadow = true;
        scene.add(shadowMesh);

        // Textures
        const tex = getMedicalLungTextures();

        // Root Group
        const rootGroup = new THREE.Group();
        lungsGroupRef.current = rootGroup;
        scene.add(rootGroup);

        // Materials
        const lungMatRight = new THREE.MeshStandardMaterial({
          color: 0xfff1f2,
          map: tex.diffuse,
          normalMap: tex.normal,
          normalScale: new THREE.Vector2(0.85, 0.85),
          roughnessMap: tex.roughness,
          roughness: 0.36,
          metalness: 0.04
        });
        const lungMatLeft = lungMatRight.clone();

        const tracheaMat = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          map: tex.trachea,
          roughness: 0.3,
          metalness: 0.05
        });

        const ringMat = new THREE.MeshStandardMaterial({
          color: 0xdae2ea,
          roughness: 0.25,
          metalness: 0.08
        });

        // --- Right Lung (3 Lobes + Fissures) ---
        const rightGroup = new THREE.Group();
        rightGroupRef.current = rightGroup;
        rightGroup.position.set(-1.18, 0, 0);

        const rSup = new THREE.Mesh(sculptLobeGeometry(0.85, 0.95, 0.85, 'rSuperior'), lungMatRight);
        rSup.position.set(-0.08, 0.72, 0.05);
        rSup.rotation.set(0.08, 0.12, 0.1);
        rSup.castShadow = true;
        rSup.receiveShadow = true;
        rightGroup.add(rSup);

        const rMed = new THREE.Mesh(sculptLobeGeometry(0.8, 0.55, 0.78, 'rMiddle'), lungMatRight);
        rMed.position.set(-0.16, -0.05, 0.25);
        rMed.rotation.set(0.02, 0.08, 0.08);
        rMed.castShadow = true;
        rMed.receiveShadow = true;
        rightGroup.add(rMed);

        const rInf = new THREE.Mesh(sculptLobeGeometry(0.96, 0.9, 0.95, 'rInferior'), lungMatRight);
        rInf.position.set(-0.05, -0.75, -0.1);
        rInf.rotation.set(-0.05, 0.04, 0.05);
        rInf.castShadow = true;
        rInf.receiveShadow = true;
        rightGroup.add(rInf);
        rootGroup.add(rightGroup);

        // --- Left Lung (2 Lobes + Cardiac Notch & Lingula) ---
        const leftGroup = new THREE.Group();
        leftGroupRef.current = leftGroup;
        leftGroup.position.set(1.18, 0, 0);

        const lSup = new THREE.Mesh(sculptLobeGeometry(0.84, 1.05, 0.84, 'lSuperior'), lungMatLeft);
        lSup.position.set(0.08, 0.65, 0.05);
        lSup.rotation.set(0.08, -0.12, -0.1);
        lSup.castShadow = true;
        lSup.receiveShadow = true;
        leftGroup.add(lSup);

        const lInf = new THREE.Mesh(sculptLobeGeometry(0.92, 0.95, 0.92, 'lInferior'), lungMatLeft);
        lInf.position.set(0.06, -0.72, -0.1);
        lInf.rotation.set(-0.05, -0.04, -0.05);
        lInf.castShadow = true;
        lInf.receiveShadow = true;
        leftGroup.add(lInf);
        rootGroup.add(leftGroup);

        // --- Trachea & Hyaline Cartilage C-Rings ---
        const airwayGroup = new THREE.Group();
        const trachea = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.21, 1.6, 24), tracheaMat);
        trachea.position.set(0, 1.85, 0.05);
        trachea.castShadow = true;
        airwayGroup.add(trachea);

        for (let r = 0; r < 12; r++) {
          const ring = new THREE.Mesh(
            new THREE.TorusGeometry(0.24, 0.026, 12, 28, Math.PI * 1.6),
            ringMat
          );
          ring.position.set(0, 1.15 + r * 0.12, 0.05);
          ring.rotation.x = Math.PI / 2;
          ring.rotation.z = Math.PI * 0.2;
          ring.castShadow = true;
          airwayGroup.add(ring);
        }

        // Primary Bronchi (Carina)
        const bronchusMat = new THREE.MeshStandardMaterial({ color: 0x8ba2b5, roughness: 0.35 });
        const rBronch = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.85, 16), bronchusMat);
        rBronch.position.set(-0.35, 0.85, 0.02);
        rBronch.rotation.z = Math.PI / 4.2;
        rBronch.castShadow = true;
        airwayGroup.add(rBronch);

        const lBronch = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.11, 1.05, 16), bronchusMat);
        lBronch.position.set(0.42, 0.8, 0.02);
        lBronch.rotation.z = -Math.PI / 3.4;
        lBronch.castShadow = true;
        airwayGroup.add(lBronch);
        rootGroup.add(airwayGroup);

        // --- Air Particles Flow ---
        const pCount = 50;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3);
        const pVels = [];
        for (let i = 0; i < pCount; i++) {
          pPos[i * 3] = 0;
          pPos[i * 3 + 1] = 2.4 - Math.random() * 1.8;
          pPos[i * 3 + 2] = 0.05;
          pVels.push({ y: -0.025 - Math.random() * 0.02, x: (Math.random() - 0.5) * 0.02 });
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({
          size: 0.12,
          color: 0x38bdf8,
          transparent: true,
          opacity: 0.85
        });
        const particles = new THREE.Points(pGeo, pMat);
        airParticlesRef.current = particles;
        rootGroup.add(particles);

        // --- Anatomical Diaphragm Dome ---
        const diaMat = new THREE.MeshStandardMaterial({
          color: 0x881337,
          roughness: 0.5,
          transparent: true,
          opacity: 0.72
        });
        const diaphragm = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.85, 0.48, 32), diaMat);
        diaphragm.position.set(0, -2.15, 0);
        diaphragm.scale.set(1.05, 0.45, 0.75);
        diaphragm.receiveShadow = true;
        diaphragmRef.current = diaphragm;
        rootGroup.add(diaphragm);

        // --- High-DPI Pill Hotspot Pins (Image 2 Style) ---
        const pins = [];
        const activeHotspots = hotspots || DEFAULT_HOTSPOTS;
        activeHotspots.forEach(hs => {
          const pinCanvas = document.createElement('canvas');
          pinCanvas.width = 360;
          pinCanvas.height = 100;
          const pctx = pinCanvas.getContext('2d');

          // Rounded pill with drop shadow
          pctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
          pctx.shadowBlur = 12;
          pctx.shadowOffsetY = 4;
          const x = 12, y = 14, w = 336, h = 72, r = 36;
          pctx.beginPath();
          pctx.moveTo(x + r, y);
          pctx.arcTo(x + w, y, x + w, y + h, r);
          pctx.arcTo(x + w, y + h, x, y + h, r);
          pctx.arcTo(x, y + h, x, y, r);
          pctx.arcTo(x, y, x + w, y, r);
          pctx.closePath();
          pctx.fillStyle = '#ffffff';
          pctx.fill();

          pctx.shadowColor = 'transparent';
          pctx.lineWidth = 2.5;
          pctx.strokeStyle = '#e2e8f0';
          pctx.stroke();

          // Green number circle
          pctx.beginPath();
          pctx.arc(x + 36, y + 36, 24, 0, Math.PI * 2);
          pctx.fillStyle = '#10b981';
          pctx.fill();

          pctx.font = 'bold 26px "Plus Jakarta Sans", sans-serif';
          pctx.fillStyle = '#ffffff';
          pctx.textAlign = 'center';
          pctx.textBaseline = 'middle';
          pctx.fillText(hs.id.toString(), x + 36, y + 37);

          // Label text
          pctx.font = 'bold 25px "Plus Jakarta Sans", sans-serif';
          pctx.fillStyle = '#0f172a';
          pctx.textAlign = 'left';
          const label = hs.shortName || (hs.id === 1 ? 'Paru Kanan' : hs.id === 2 ? 'Paru Kiri' : hs.id === 3 ? 'Saluran Napas' : 'Diafragma');
          pctx.fillText(label, x + 72, y + 37);

          const pinTex = new THREE.CanvasTexture(pinCanvas);
          const spriteMat = new THREE.SpriteMaterial({ map: pinTex, depthTest: false });
          const sprite = new THREE.Sprite(spriteMat);
          const p = hs.pos || hs.position || [0, 0, 0];
          sprite.position.set(p[0], p[1], p[2]);
          sprite.scale.set(1.4, 0.39, 1);
          rootGroup.add(sprite);
          pins.push({ id: hs.id, sprite, pos: p });
        });
        pinsRef.current = pins;

        // Interaction (Orbit rotation on drag)
        let isDown = false;
        let prevX = 0, prevY = 0;
        let rotY = 0, rotX = 0;

        const onDown = (e) => {
          isDown = true;
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          prevX = clientX; prevY = clientY;
        };

        const onMove = (e) => {
          if (!isDown) return;
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          const deltaX = clientX - prevX;
          const deltaY = clientY - prevY;
          prevX = clientX; prevY = clientY;
          rotY += deltaX * 0.008;
          rotX += deltaY * 0.008;
        };

        const onUp = () => { isDown = false; };

        container.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        container.addEventListener('touchstart', onDown);
        window.addEventListener('touchmove', onMove);
        window.addEventListener('touchend', onUp);

        // Click Raycasting on Pins
        const onClick = (e) => {
          const rect = container.getBoundingClientRect();
          const mouse = new THREE.Vector2(
            ((e.clientX - rect.left) / rect.width) * 2 - 1,
            -((e.clientY - rect.top) / rect.height) * 2 + 1
          );
          const raycaster = new THREE.Raycaster();
          raycaster.setFromCamera(mouse, camera);
          const sprites = pins.map(p => p.sprite);
          const hits = raycaster.intersectObjects(sprites);
          if (hits.length > 0) {
            playClickSound();
            const hitPin = pins.find(p => p.sprite === hits[0].object);
            if (hitPin) onSelect(hitPin.id);
          }
        };
        container.addEventListener('click', onClick);

        // Animation Loop
        let frameId;
        let time = 0;
        const animate = () => {
          time += 0.03;
          rootGroup.rotation.y = rotY;
          rootGroup.rotation.x = rotX;

          // Breathing Animation
          if (isBreathing) {
            const breath = Math.sin(time * 2);
            rightGroup.scale.set(1 + breath * 0.05, 1 + breath * 0.04, 1 + breath * 0.06);
            leftGroup.scale.set(1 + breath * 0.05, 1 + breath * 0.04, 1 + breath * 0.06);
            if (diaphragmRef.current) {
              diaphragmRef.current.position.y = -2.15 - breath * 0.08;
            }
          }

          // Respiration particles flow down
          if (airParticlesRef.current) {
            const posAttr = airParticlesRef.current.geometry.attributes.position;
            const arr = posAttr.array;
            for (let i = 0; i < pCount; i++) {
              arr[i * 3 + 1] += pVels[i].y;
              if (arr[i * 3 + 1] < 0.2) {
                arr[i * 3 + 1] = 2.4;
                arr[i * 3] = 0;
              } else if (arr[i * 3 + 1] < 1.0) {
                arr[i * 3] += pVels[i].x * 1.5;
              }
            }
            posAttr.needsUpdate = true;
          }

          // Pins Pulse & Scale
          pins.forEach(p => {
            const isSel = p.id === selectedId;
            const pulse = isSel ? Math.sin(time * 6) * 0.06 : 0;
            p.sprite.scale.set(1.4 + pulse + (isSel ? 0.15 : 0), 0.39 + pulse * 0.3 + (isSel ? 0.05 : 0), 1);
          });

          renderer.render(scene, camera);
          frameId = requestAnimationFrame(animate);
        };
        animate();

        const handleResize = () => {
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          container.removeEventListener('mousedown', onDown);
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          container.removeEventListener('click', onClick);
        };
      }, [selectedId, isBreathing, hotspots, studioMode]);

      return (
        <div ref={mountRef} className="w-full h-full relative canvas-container cursor-grab active:cursor-grabbing">
          {/* Top-left Specimen Label */}
          <div className="absolute top-4 left-4 z-10 px-3.5 py-1.5 rounded-full bg-white/90 backdrop-blur border border-slate-200 shadow-sm text-xs font-semibold text-slate-800 pointer-events-none flex items-center gap-2">

          {/* Bottom Interaction Guide */}
          <div className="absolute bottom-3 left-1/2 -translate-x-1/2 z-10 px-4 py-1 rounded-full bg-white/80 backdrop-blur border border-slate-200/80 text-[11px] text-slate-600 shadow-sm pointer-events-none">
            Geser untuk memutar · Gulir untuk zoom · Klik pin untuk informasi
          </div>
        </div>
      );
    }

                  <div>
                    <h4 className="text-xs font-bold text-slate-400 uppercase mb-2">JALUR UDARA</h4>
                    <div className="space-y-1.5 text-xs">
                      {airway.map(item => (
                        <div key={item.step} className="p-2 bg-slate-900/60 rounded-lg border border-slate-800 flex justify-between items-center">
                          <span className="text-slate-300">{item.step}. {item.name}</span>
                          {item.inModule && <span className="text-[10px] text-emerald-400">ada di modul</span>}
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="p-4 bg-amber-500/10 border border-amber-500/20 rounded-2xl text-xs text-amber-200">
                    <strong>Tahukah kamu?</strong> {trivia}
                  </div>
                </aside>
              </div>
            )}

            {/* 3. Panel Admin (Admin Dashboard) */}
            {route === '/admin' && (
              <div className="max-w-6xl mx-auto p-6 space-y-6">
                <div className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-800">
                  <div>
                    <h2 className="text-2xl font-black text-white flex items-center gap-2">
                      <span>⚙ Panel Admin Materi 3D</span>
                      <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">
                        Editor Guru
                      </span>
                    </h2>
                    <p className="text-xs text-slate-400 mt-1">
                      Edit titik anatomi, koordinat 3D, alur napas, fakta kunci sains, dan katalog modul.
                    </p>
                  </div>

                  <div className="flex gap-2">
                    <button onClick={() => navTo('/modul/sistem-pernapasan')} className="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700">
                      Pratinjau Modul 3D
                    </button>
                    <button onClick={handleResetAdminData} className="px-3.5 py-2 rounded-xl text-xs font-semibold bg-rose-950/40 text-rose-300 border border-rose-800/50 hover:bg-rose-900/60">
                      Reset Default
                    </button>
                    <button onClick={handleSaveAdminData} className="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950 hover:bg-emerald-400 shadow-lg">
                      Simpan Perubahan
                    </button>
                  </div>
                </div>

                {/* Tabs */}
                <div className="flex gap-2 border-b border-slate-800 pb-2">
                  <button onClick={() => setAdminTab('hotspots')} className={`px-4 py-2 rounded-xl text-xs font-bold ${adminTab === 'hotspots' ? 'bg-emerald-500 text-slate-950' : 'bg-slate-900 text-slate-400'}`}>
                    Titik Belajar 3D ({hotspots.length})
                  </button>
                  <button onClick={() => setAdminTab('facts')} className={`px-4 py-2 rounded-xl text-xs font-bold ${adminTab === 'facts' ? 'bg-emerald-500 text-slate-950' : 'bg-slate-900 text-slate-400'}`}>
                    Fakta Kunci & Trivia
                  </button>
                  <button onClick={() => setAdminTab('modules')} className={`px-4 py-2 rounded-xl text-xs font-bold ${adminTab === 'modules' ? 'bg-emerald-500 text-slate-950' : 'bg-slate-900 text-slate-400'}`}>
                    Katalog 6 Modul IPA
                  </button>
                </div>

                {/* TAB: Hotspots */}
                {adminTab === 'hotspots' && (
                  <div className="space-y-4">
                    <div className="flex justify-between items-center bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                      <span className="text-xs text-slate-300">Ubah teks dan koordinat pin 3D pada model organ.</span>
                      <button
                        onClick={() => {
                          const newId = hotspots.length > 0 ? Math.max(...hotspots.map(h => h.id)) + 1 : 1;
                          setHotspots([...hotspots, {
                            id: newId,
                            name: `Titik Belajar ${newId}`,
                            shortName: `Titik ${newId}`,
                            pos: [0, 0, 0.4],
                            desc: 'Penjelasan anatomi titik ini...',
                            func: 'Fungsi biologis titik ini...'
                          }]);
                        }}
                        className="px-3 py-1.5 rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold"
                      >
                        + Tambah Titik Belajar
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {hotspots.map((hs, idx) => (
                        <div key={hs.id} className="p-4 bg-slate-900 rounded-2xl border border-slate-800 space-y-3">
                          <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                            <span className="w-6 h-6 rounded bg-emerald-500 text-slate-950 font-bold flex items-center justify-center text-xs">
                              {hs.id}
                            </span>
                            <button
                              onClick={() => setHotspots(hotspots.filter(h => h.id !== hs.id))}
                              className="text-xs text-rose-400 hover:underline"
                            >
                              Hapus
                            </button>
                          </div>

                          <div>
                            <label className="text-[10px] text-slate-400 block font-bold">Nama Lengkap Organ</label>
                            <input
                              type="text"
                              value={hs.name}
                              onChange={(e) => {
                                const copy = [...hotspots];
                                copy[idx].name = e.target.value;
                                setHotspots(copy);
                              }}
                              className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white"
                            />
                          </div>

                          <div className="grid grid-cols-3 gap-2">
                            <div>
                              <label className="text-[10px] text-slate-400 block font-bold">Posisi X</label>
                              <input
                                type="number"
                                step="0.1"
                                value={(hs.pos || hs.position || [0,0,0])[0]}
                                onChange={(e) => {
                                  const copy = [...hotspots];
                                  const p = [...(copy[idx].pos || copy[idx].position || [0,0,0])];
                                  p[0] = parseFloat(e.target.value) || 0;
                                  copy[idx].pos = p;
                                  copy[idx].position = p;
                                  setHotspots(copy);
                                }}
                                className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white font-mono"
                              />
                            </div>
                            <div>
                              <label className="text-[10px] text-slate-400 block font-bold">Posisi Y</label>
                              <input
                                type="number"
                                step="0.1"
                                value={(hs.pos || hs.position || [0,0,0])[1]}
                                onChange={(e) => {
                                  const copy = [...hotspots];
                                  const p = [...(copy[idx].pos || copy[idx].position || [0,0,0])];
                                  p[1] = parseFloat(e.target.value) || 0;
                                  copy[idx].pos = p;
                                  copy[idx].position = p;
                                  setHotspots(copy);
                                }}
                                className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white font-mono"
                              />
                            </div>
                            <div>
                              <label className="text-[10px] text-slate-400 block font-bold">Posisi Z</label>
                              <input
                                type="number"
                                step="0.1"
                                value={(hs.pos || hs.position || [0,0,0])[2]}
                                onChange={(e) => {
                                  const copy = [...hotspots];
                                  const p = [...(copy[idx].pos || copy[idx].position || [0,0,0])];
                                  p[2] = parseFloat(e.target.value) || 0;
                                  copy[idx].pos = p;
                                  copy[idx].position = p;
                                  setHotspots(copy);
                                }}
                                className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white font-mono"
                              />
                            </div>
                          </div>

                          <div>
                            <label className="text-[10px] text-slate-400 block font-bold">Deskripsi Anatomi</label>
                            <textarea
                              rows={2}
                              value={hs.desc || hs.description}
                              onChange={(e) => {
                                const copy = [...hotspots];
                                copy[idx].desc = e.target.value;
                                copy[idx].description = e.target.value;
                                setHotspots(copy);
                              }}
                              className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-200"
                            />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* TAB: Facts & Trivia */}
                {adminTab === 'facts' && (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="p-5 bg-slate-900 rounded-2xl border border-slate-800 space-y-3">
                      <h3 className="text-sm font-bold text-white">Fakta Kunci Paru-paru</h3>
                      <div className="space-y-2">
                        {facts.map((f, idx) => (
                          <div key={idx} className="flex gap-2 bg-slate-950 p-2 rounded-lg">
                            <input
                              type="text"
                              value={f.label}
                              onChange={(e) => {
                                const copy = [...facts];
                                copy[idx].label = e.target.value;
                                setFacts(copy);
                              }}
                              className="w-1/3 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white"
                            />
                            <input
                              type="text"
                              value={f.value}
                              onChange={(e) => {
                                const copy = [...facts];
                                copy[idx].value = e.target.value;
                                setFacts(copy);
                              }}
                              className="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white"
                            />
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="p-5 bg-slate-900 rounded-2xl border border-slate-800 space-y-3">
                      <h3 className="text-sm font-bold text-amber-400">Tahukah Kamu? (Trivia)</h3>
                      <textarea
                        rows={4}
                        value={trivia}
                        onChange={(e) => setTrivia(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-amber-200"
                      />
                    </div>
                  </div>
                )}

                {/* TAB: Modules */}
                {adminTab === 'modules' && (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {modules.map((m, idx) => (
                      <div key={m.id} className="p-4 bg-slate-900 rounded-2xl border border-slate-800 space-y-3">
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-bold text-emerald-400">{m.num}</span>
                          <select
                            value={m.status}
                            onChange={(e) => {
                              const copy = [...modules];
                              copy[idx].status = e.target.value;
                              setModules(copy);
                            }}
                            className="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-[11px] text-white"
                          >
                            <option value="Tersedia">Tersedia</option>
                            <option value="Pratinjau">Pratinjau</option>
                            <option value="Segera Hadir">Segera Hadir</option>
                          </select>
                        </div>
                        <input
                          type="text"
                          value={m.title}
                          onChange={(e) => {
                            const copy = [...modules];
                            copy[idx].title = e.target.value;
                            setModules(copy);
                          }}
                          className="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1 text-xs font-bold text-white"
                        />
                        <textarea
                          rows={2}
                          value={m.desc}
                          onChange={(e) => {
                            const copy = [...modules];
                            copy[idx].desc = e.target.value;
                            setModules(copy);
                          }}
                          className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-slate-300"
                        />
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* 4. Halaman Masuk */}
            {route === '/masuk' && (
              <div className="max-w-md mx-auto my-20 p-8 bg-slate-900 border border-slate-800 rounded-3xl space-y-6 text-center">
                <div onClick={() => navTo('/')} className="font-extrabold text-2xl cursor-pointer">
                  3d<span className="text-emerald-400">Funlearn</span>
                </div>
                <h2 className="text-2xl font-bold text-white">Masuk untuk membuka semua modul.</h2>
                <p className="text-xs text-slate-400">Satu akun Google untuk satu guru. Modul Sistem Pernapasan tetap bisa dicoba gratis.</p>
                <button onClick={() => navTo('/modul/sistem-pernapasan')} className="w-full py-3.5 bg-white text-slate-950 font-bold rounded-2xl text-sm flex items-center justify-center gap-2 shadow-xl hover:bg-slate-100">
                  <span>Masuk dengan Google</span>
                </button>
                <div className="text-left text-xs text-slate-400 space-y-2 pt-4 border-t border-slate-800">
                  <div>✓ Buka semua modul selama berlangganan.</div>
                  <div>✓ Bagikan ke murid lewat QR tanpa akun.</div>
                  <div>✓ Cukup akun Google, tanpa password.</div>
                </div>
                <button onClick={() => navTo('/')} className="text-xs text-slate-400 hover:text-emerald-400">
                  ← Kembali ke beranda
                </button>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800 py-6 px-4 bg-[#070b14] text-xs text-slate-400">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>Didukung <strong className="text-slate-200">TutorFlow</strong></div>
              <button onClick={() => setAudioOn(toggleGlobalAudio())} className="px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-slate-300">
                Suara: {audioOn ? 'Hidup' : 'Mati'}
              </button>
              <div className="flex gap-4">
                <button onClick={() => navTo('/privasi')} className="hover:text-white">Kebijakan Privasi</button>
                <span>·</span>
                <button onClick={() => navTo('/syarat')} className="hover:text-white">Syarat Layanan</button>
              </div>
            </div>
          </footer>

          {/* Share Modal */}
          {shareOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-sm w-full text-center space-y-4">
                <h3 className="text-lg font-bold text-white">Bagikan ke Murid</h3>
                <div className="p-6 bg-white rounded-xl inline-block">
                  <div className="w-36 h-36 bg-slate-900 flex items-center justify-center text-white text-xs font-mono">
                    [QR CODE LINK]
                  </div>
                </div>
                <p className="text-xs text-slate-400">Murid membuka kamera HP dan scan langsung dari layar kelas.</p>
                <button onClick={() => setShareOpen(false)} className="w-full py-2 bg-slate-800 rounded-xl text-xs font-semibold text-slate-200">
                  Tutup
                </button>
              </div>
            </div>
          )}

          {/* Catalog Modal */}
          {catalogOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-2xl w-full max-h-[80vh] overflow-y-auto space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 className="text-lg font-bold text-white">Katalog Modul IPA Kelas 8</h3>
                  <button onClick={() => setCatalogOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {modules.map(m => (
                    <div key={m.id} onClick={() => { if (m.free) { navTo('/modul/sistem-pernapasan'); setCatalogOpen(false); } }} className={`p-4 rounded-xl border ${m.free ? 'bg-slate-800 border-emerald-500/50 cursor-pointer' : 'bg-slate-900 border-slate-800 opacity-60'}`}>
                      <div className="text-[10px] font-bold text-emerald-400">{m.num}</div>
                      <div className="font-bold text-white text-sm">{m.title}</div>
                      <div className="text-xs text-slate-400 mt-1">{m.desc}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
